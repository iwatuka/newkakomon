<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過去問分析</title>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
  <!-- YEAR_SCRIPTS_START -->
  <script src="data/数学/国際医療福祉大学/2025.js"></script>
  <script src="data/数学/慈恵/2021.js"></script>
  <script src="data/数学/慈恵/2022.js"></script>
  <script src="data/数学/慈恵/2023.js"></script>
  <script src="data/数学/慶應医学部/2020.js"></script>
  <script src="data/数学/日本医科大学/2020.js"></script>
  <script src="data/数学/昭和医科大学/2020.js"></script>
  <script src="data/数学/東京医科大/2020.js"></script>
  <script src="data/数学/自治医科大学/2021.js"></script>
  <script src="data/数学/順天/2020.js"></script>
  <!-- YEAR_SCRIPTS_END -->
</head>
<body>
<main class="app">
  <div class="topbar"><button type="button" class="back" id="backButton" hidden aria-label="前の画面に戻る">← 戻る</button><div class="title-wrap"><span id="subjectTag" class="subject-tag" hidden></span><h1 id="title">教科</h1></div></div>
  <nav class="breadcrumb" id="breadcrumb" aria-label="現在の場所"></nav>
  <div id="content"></div>
</main>
<script>
const content=document.getElementById('content');
const title=document.getElementById('title');
const breadcrumb=document.getElementById('breadcrumb');
const backButton=document.getElementById('backButton');
const subjectTag=document.getElementById('subjectTag');
const SUBJECT_COLORS={'数学':'#315f92','英語':'#367453','物理':'#a45f2b','化学':'#745599','小論文':'#a24b69'};
let path=[];
const entries=o=>Object.keys(o||{}).filter(k=>!k.startsWith('_'));
const validScore=q=>q&&q.score!==''&&q.score!=null&&q.maxScore!==''&&q.maxScore!=null&&Number.isFinite(Number(q.score))&&Number.isFinite(Number(q.maxScore))&&Number(q.maxScore)>0;
function totals(data){let score=0,max=0;for(const k of entries(data)){const q=data[k];if(validScore(q)){score+=Number(q.score);max+=Number(q.maxScore);}}return{score,max,percent:max>0?score/max*100:null};}
function average(data){const nums=entries(data).map(y=>totals(data[y]).percent).filter(v=>v!==null);return nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;}
function percentText(n){return n===null?'未入力':n.toFixed(1)+'%';}
function fmtScore(q){return validScore(q)?`${q.score} / ${q.maxScore}`:'未入力';}
function getData(){let data=DATA;for(const k of path){data=data?.[k];}return data||{};}
function go(key){path.push(key);render();window.scrollTo({top:0,behavior:'instant'});}
function crumb(index){path=path.slice(0,index);render();}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function heading(text){content.append(el('div','section-label',text));}
function line(label,sub,value,percent){
  const b=el('button','item');b.type='button';
  const main=el('span','item-main');main.append(el('span','item-label',label));if(sub)main.append(el('span','item-sub',sub));
  const right=el('span','item-right');right.append(el('span',percent===null?'item-rate muted-rate':'item-rate',value),el('span','chevron','›'));
  b.append(main,right);
  if(percent!==undefined&&percent!==null){const bar=el('div','progress');const fill=el('div','progress-fill');fill.style.width=Math.max(0,Math.min(100,percent))+'%';bar.append(fill);main.append(bar);}
  return b;
}
function render(){
  const data=getData();content.replaceChildren();breadcrumb.replaceChildren();backButton.hidden=!path.length;
  const subject=path[0]||'';document.documentElement.style.setProperty('--accent',SUBJECT_COLORS[subject]||'#334155');
  subjectTag.hidden=!subject;subjectTag.textContent=subject;subjectTag.style.color=SUBJECT_COLORS[subject]||'#334155';
  const titles=['教科','大学','年度','大問','詳細'];title.textContent=titles[path.length]||'過去問分析';
  const home=el('button','crumb','教科');home.type='button';home.addEventListener('click',()=>crumb(0));breadcrumb.append(home);
  path.forEach((key,i)=>{breadcrumb.append(el('span','crumb-sep','/'));if(i===path.length-1){breadcrumb.append(el('span','crumb-current',key));}else{const b=el('button','crumb',key);b.type='button';b.addEventListener('click',()=>crumb(i+1));breadcrumb.append(b);}});
  if(path.length===0){
    content.append(el('p','page-lead','記録を確認する教科を選んでください。'));heading('教科');
    const list=el('div','list');for(const key of entries(data)){const universities=entries(data[key]);const years=universities.reduce((n,u)=>n+entries(data[key][u]).length,0);const b=line(key,years?`${universities.length}大学 / ${years}年度`:'記録なし',years?String(years)+'年度':'',null);b.classList.add('subject-item');b.style.setProperty('--subject-color',SUBJECT_COLORS[key]||'#334155');b.addEventListener('click',()=>go(key));list.append(b);}content.append(list);return;
  }
  if(path.length===1){heading('大学');const keys=entries(data);if(!keys.length){empty('まだ過去問データがありません。data/ に大学・年度のファイルを追加するとここに表示されます。');return;}const list=el('div','list');for(const key of keys){const years=entries(data[key]);const n=average(data[key]);const b=line(key,years.length+'年度分の記録',percentText(n),n);b.addEventListener('click',()=>go(key));list.append(b);}content.append(list);return;}
  if(path.length===2){heading('年度');const keys=entries(data);if(!keys.length){empty('年度データがありません。');return;}const list=el('div','list');for(const key of keys){const t=totals(data[key]);const b=line(key,'受験日：'+(data[key]._date||'未記入'),percentText(t.percent),t.percent);b.addEventListener('click',()=>go(key));list.append(b);}content.append(list);return;}
  if(path.length===3){
    const t=totals(data),panel=el('section','panel'),top=el('div','summary-top'),left=el('div');left.append(el('div','eyebrow','合計得点'));const score=el('div','hero-score',t.max?`${t.score} / ${t.max}`:'未入力');left.append(score);top.append(left,el('div','score-percent',percentText(t.percent)));panel.append(top);
    if(t.percent!==null){const p=el('div','progress');const fill=el('div','progress-fill');fill.style.width=Math.max(0,Math.min(100,t.percent))+'%';p.append(fill);panel.append(p);}
    addMeta(panel,'受験日',data._date||'未記入');addMeta(panel,'コメント',data._comment||'コメントなし');content.append(panel);heading('大問別の得点');
    const keys=entries(data);if(!keys.length){empty('大問データがありません。');return;}const list=el('div','list');for(const key of keys){const q=data[key];const n=validScore(q)?Number(q.score)/Number(q.maxScore)*100:null;const b=line(key,fmtScore(q),percentText(n),n);b.addEventListener('click',()=>go(key));list.append(b);}content.append(list);return;
  }
  if(path.length===4){const q=data,n=validScore(q)?Number(q.score)/Number(q.maxScore)*100:null;const panel=el('section','panel'),top=el('div','summary-top'),left=el('div');left.append(el('div','eyebrow','得点'));left.append(el('div','hero-score',fmtScore(q)));top.append(left,el('div','score-percent',percentText(n)));panel.append(top);if(n!==null){const p=el('div','progress'),f=el('div','progress-fill');f.style.width=Math.max(0,Math.min(100,n))+'%';p.append(f);panel.append(p);}content.append(panel);const stack=el('div','detail-stack');addBox(stack,'どこができなかったか',q.failed);addBox(stack,'何ができれば解けたか',q.needed);content.append(stack);}
}
function addMeta(parent,label,value){const row=el('div','meta');row.append(el('div','meta-label',label),el('div','meta-value',value));parent.append(row);}
function addBox(parent,label,value){const box=el('div','detail-box');box.append(el('div','detail-label',label),el('div',value?'detail-value':'detail-value placeholder',value||'記録なし'));parent.append(box);}
function empty(message){content.append(el('div','empty',message));}
backButton.addEventListener('click',()=>{if(path.length){path.pop();render();}});
window.addEventListener('popstate',()=>{path=[];render();});
render();
</script>
</body>
</html>
