<body>
<main class="app">
  <div class="topbar"><button type="button" class="back" id="backButton" hidden aria-label="前の画面に戻る">← 戻る</button><div class="title-wrap"><span id="subjectTag" class="subject-tag" hidden></span><h1 id="title">たくよ過去問</h1></div></div>
  <nav class="breadcrumb" id="breadcrumb" aria-label="現在の場所"></nav>
  <div id="content"></div>
</main>
<script>
const content=document.getElementById('content');
const title=document.getElementById('title');
const breadcrumb=document.getElementById('breadcrumb');
const backButton=document.getElementById('backButton');
const subjectTag=document.getElementById('subjectTag');
const SUBJECT_COLORS={'数学':'#315f92','英語':'#367453','物理':'#a45f2b','化学':'#745599','小論文':'#a24b69'};
let path=[];
const entries=o=>Object.keys(o||{}).filter(k=>!k.startsWith('_'));
const validScore=q=>q&&q.score!==''&&q.score!=null&&q.maxScore!==''&&q.maxScore!=null&&Number.isFinite(Number(q.score))&&Number.isFinite(Number(q.maxScore))&&Number(q.maxScore)>0;
function totals(data){let score=0,max=0;for(const k of entries(data)){const q=data[k];if(validScore(q)){score+=Number(q.score);max+=Number(q.maxScore);}}return{score,max,percent:max>0?score/max*100:null};}
function untimedTotals(data){
  // 年度の合計が入力されていればそれを優先。未入力の場合は大問別データを合計する。
  const has=(v)=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v));
  const score=data?._untimedScore,max=data?._untimedMaxScore;
  if(has(score)&&has(max)&&Number(max)>0){return{score:Number(score),max:Number(max),percent:Number(score)/Number(max)*100};}
  let sum=0,full=0;
  for(const k of entries(data)){const q=data[k];if(q&&has(q.untimedScore)&&has(q.untimedMaxScore)&&Number(q.untimedMaxScore)>0){sum+=Number(q.untimedScore);full+=Number(q.untimedMaxScore);}}
  if(full>0)return{score:sum,max:full,percent:sum/full*100};
  const pct=data?._untimedPercent;
  return{score:null,max:null,percent:has(pct)&&Number(pct)>=0&&Number(pct)<=100?Number(pct):null};
}
function average(data,untimed=false){const nums=entries(data).map(y=>(untimed?untimedTotals(data[y]):totals(data[y])).percent).filter(v=>v!==null);return nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;}
function valueScore(t){return t.max?`${t.score} / ${t.max}`:t.percent===null?'未入力':'得点未登録';}
function comparison(label,inside,outside){
  const row=el('div','score-pair');
  for(const [caption,t] of [['時間制限内',inside],['時間外',outside]]){
    const cell=el('div','score-cell');
    cell.append(el('div','score-caption',caption));
    cell.append(el('div',t.percent===null?'score-number score-empty':'score-number',label==='rate'?percentText(t.percent):valueScore(t)));
    if(label==='score')cell.append(el('div','score-secondary',percentText(t.percent)));
    row.append(cell);
  }
  return row;
}
function addDualRates(button,inside,outside){
  button.classList.add('dual-item');
  const old=button.querySelector('.item-rate');if(old)old.remove();
  const right=button.querySelector('.item-right');
  const rates=el('span','dual-rates');
  for(const [caption,n] of [['時間制限内',inside],['時間外',outside]]){
    const span=el('span','dual-rate');span.append(el('span','dual-caption',caption),el('span',n===null?'dual-value muted-rate':'dual-value',percentText(n)));rates.append(span);
  }
  right.prepend(rates);
  return button;
}
function percentText(n){return n===null?'未入力':Math.round(n)+'%';}
function fmtScore(q){return validScore(q)?`${q.score} / ${q.maxScore}`:'未入力';}
function getData(){let data=DATA;for(const k of path){data=data?.[k];}return data||{};}
function go(key){path.push(key);render();window.scrollTo({top:0,behavior:'instant'});}
function crumb(index){path=path.slice(0,index);render();}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function heading(text){content.append(el('div','section-label',text));}
function line(label,sub,value,percent){
  const b=el('button','item');b.type='button';
  const main=el('span','item-main');main.append(el('span','item-label',label));if(sub)main.append(el('span','item-sub',sub));
  const right=el('span','item-right');right.append(el('span',percent===null?'item-rate muted-rate':'item-rate',value),el('span','chevron','›'));
  b.append(main,right);
  if(percent!==undefined&&percent!==null){const bar=el('div','progress');const fill=el('div','progress-fill');fill.style.width=Math.max(0,Math.min(100,percent))+'%';bar.append(fill);main.append(bar);}
  return b;
}
function render(){
  const data=getData();content.replaceChildren();breadcrumb.replaceChildren();backButton.hidden=!path.length;
  const subject=path[0]||'';document.documentElement.style.setProperty('--accent',SUBJECT_COLORS[subject]||'#334155');
  subjectTag.hidden=!subject;subjectTag.textContent=subject;subjectTag.style.color=SUBJECT_COLORS[subject]||'#334155';
  const titles=['たくよ過去問','大学','年度','大問','詳細'];title.textContent=titles[path.length]||'たくよ過去問';
  const home=el('button','crumb','教科');home.type='button';home.addEventListener('click',()=>crumb(0));breadcrumb.append(home);
  path.forEach((key,i)=>{breadcrumb.append(el('span','crumb-sep','/'));if(i===path.length-1){breadcrumb.append(el('span','crumb-current',key));}else{const b=el('button','crumb',key);b.type='button';b.addEventListener('click',()=>crumb(i+1));breadcrumb.append(b);}});
  if(path.length===0){
    content.append(el('p','page-lead','記録を確認する教科を選んでください。'));heading('教科');
    const list=el('div','list');for(const key of entries(data)){const universities=entries(data[key]);const years=universities.reduce((n,u)=>n+entries(data[key][u]).filter(y=>totals(data[key][u][y]).percent!==null).length,0);const b=line(key,years?`${universities.length}大学 / ${years}年度`:'記録なし',years?String(years)+'年度':'',null);b.classList.add('subject-item');b.style.setProperty('--subject-color',SUBJECT_COLORS[key]||'#334155');b.addEventListener('click',()=>go(key));list.append(b);}content.append(list);return;
  }
  if(path.length===1){heading('大学');const keys=entries(data);if(!keys.length){empty('まだ過去問データがありません。data/ に大学・年度のファイルを追加するとここに表示されます。');return;}const list=el('div','list');for(const key of keys){const years=entries(data[key]);const n=average(data[key]);const u=average(data[key],true);const recorded=years.filter(y=>totals(data[key][y]).percent!==null).length;const b=addDualRates(line(key,recorded?recorded+'年度分の記録':'記録なし（2020〜2026年入力可）',percentText(n),n),n,u);b.addEventListener('click',()=>go(key));list.append(b);}content.append(list);return;}
  if(path.length===2){heading('年度');const keys=entries(data);if(!keys.length){empty('年度データがありません。');return;}const list=el('div','list');for(const key of keys){const t=totals(data[key]),u=untimedTotals(data[key]);const b=addDualRates(line(key,'受験日：'+(data[key]._date||'未記入'),percentText(t.percent),t.percent),t.percent,u.percent);b.addEventListener('click',()=>go(key));list.append(b);}content.append(list);return;}
  if(path.length===3){
    const t=totals(data),u=untimedTotals(data),panel=el('section','panel');
    panel.append(comparison('score',t,u));
    // グラフは従来の時間制限内得点率を示す。双方の数字を並べて比較できる。
    if(t.percent!==null){const p=el('div','progress');const fill=el('div','progress-fill');fill.style.width=Math.max(0,Math.min(100,t.percent))+'%';p.append(fill);panel.append(p);}
    addMeta(panel,'受験日',data._date||'未記入');addMeta(panel,'コメント',data._comment||'コメントなし');content.append(panel);heading('大問別の得点');
    const keys=entries(data);if(!keys.length){empty('大問データがありません。');return;}const list=el('div','list');for(const key of keys){const q=data[key];const n=validScore(q)?Number(q.score)/Number(q.maxScore)*100:null;const b=line(key,fmtScore(q),percentText(n),n);b.addEventListener('click',()=>go(key));list.append(b);}content.append(list);return;
  }
  if(path.length===4){
    const q=data,n=validScore(q)?Number(q.score)/Number(q.maxScore)*100:null;
    const has=(v)=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v));
    const un=has(q.untimedScore)&&has(q.untimedMaxScore)&&Number(q.untimedMaxScore)>0?{score:Number(q.untimedScore),max:Number(q.untimedMaxScore),percent:Number(q.untimedScore)/Number(q.untimedMaxScore)*100}:{score:null,max:null,percent:null};
    const panel=el('section','panel');panel.append(comparison('score',{score:q.score,max:validScore(q)?q.maxScore:null,percent:n},un));
    if(n!==null){const p=el('div','progress'),f=el('div','progress-fill');f.style.width=Math.max(0,Math.min(100,n))+'%';p.append(f);panel.append(p);}
    content.append(panel);const stack=el('div','detail-stack');addBox(stack,'どこができなかったか',q.failed);addBox(stack,'何ができれば解けたか',q.needed);content.append(stack);
  }
}
function addMeta(parent,label,value){const row=el('div','meta');row.append(el('div','meta-label',label),el('div','meta-value',value));parent.append(row);}
function addBox(parent,label,value){const box=el('div','detail-box');box.append(el('div','detail-label',label),el('div',value?'detail-value':'detail-value placeholder',value||'記録なし'));parent.append(box);}
function empty(message){content.append(el('div','empty',message));}
backButton.addEventListener('click',()=>{if(path.length){path.pop();render();}});
window.addEventListener('popstate',()=>{path=[];render();});
render();
</script>
